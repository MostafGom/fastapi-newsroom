[project]
name = "newsroom"
version = "0.1.0"
description = "Multilingual news publishing platform: public site, editorial dashboard and JSON API."
authors = [
    { name = "mg", email = "mg@all.github" }
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "hijridate>=2.6.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
newsroom = "newsroom.cli:app"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "N", "PT", "DTZ"]
# B008: FastAPI Depends() defaults. RUF012: Pydantic copies mutable defaults.
# N818: domain exceptions read as outcomes (NotFound, Conflict) rather than *Error.
ignore = ["B008", "RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
