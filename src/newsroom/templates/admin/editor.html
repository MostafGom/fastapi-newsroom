{% extends "admin/base.html" %}
{% block title %}{{ _("editor.title") }} · {{ _("admin.title") }}{% endblock %}
{% block content %}
<div class="mb-4 flex items-center justify-between gap-4">
  <div>
    <h1 class="text-2xl font-bold">{{ _("editor.title") }}</h1>
    <p class="lede">{{ _("editor.intro") }}</p>
  </div>
  <nav class="flex gap-3 text-sm" aria-label="{{ _('editor.direction') }}">
    <a href="/admin/editor?dir=rtl" {% if editor_dir == "rtl" %}class="font-bold" aria-current="page"{% endif %}>{{ _("locale.ar") }}</a>
    <a href="/admin/editor?dir=ltr" {% if editor_dir == "ltr" %}class="font-bold" aria-current="page"{% endif %}>{{ _("locale.en") }}</a>
  </nav>
</div>
<form class="form form-wide panel" hx-post="/admin/editor/preview" hx-target="#preview" hx-swap="innerHTML">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="editor_dir" value="{{ editor_dir }}">
  {% include "admin/partials/richtext.html" %}
  <button class="btn mt-3" type="submit">{{ _("editor.preview") }}</button>
</form>
<section id="preview" class="mt-6" aria-live="polite"></section>
{% endblock %}
