{% extends "admin/base.html" %}
{% block title %}{{ _("manage.settings") }} · {{ _("admin.title") }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold">{{ _("manage.settings") }}</h1>
<p class="lede mb-4">{{ _("manage.settings_help") }}</p>
{% include "admin/partials/notice.html" %}
<form class="form panel" method="post" action="/admin/settings">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="field">{{ _("manage.site_name") }}
    <input name="site_name" required value="{{ current.site_name }}">
  </label>
  <label class="check">
    <input type="checkbox" name="registration_enabled" value="1" {% if current.registration_enabled %}checked{% endif %}>
    {{ _("manage.registration") }}
  </label>
  <button class="btn" type="submit">{{ _("manage.save") }}</button>
</form>
{% endblock %}
