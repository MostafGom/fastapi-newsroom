# What `docker compose up --build` does: build the app image, run editorial then analytics
# migrations, then start the web app on port 8000 and the worker. It does not start Postgres.
# Containers cannot reach the host's "localhost", so they read DOCKER_DATABASE_URL and
# DOCKER_ANALYTICS_DATABASE_URL (host Postgres on port 5433). See README, Docker.
#
# `docker compose --profile db up --build` also starts Postgres 18. On the first start of an
# empty volume, docker/postgres/01-databases.sh creates the test and analytics databases.
# Point the DOCKER_* URLs at db:5432 for that mode (password newsroom). Host port is 5434.

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}
    ANALYTICS_DATABASE_URL: ${DOCKER_ANALYTICS_DATABASE_URL:?Set DOCKER_ANALYTICS_DATABASE_URL in .env}
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && alembic -c alembic_analytics.ini upgrade head"]
    depends_on:
      db:
        condition: service_healthy
        required: false

  web:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "newsroom.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18
    profiles: ["db"]
    environment:
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: newsroom
      POSTGRES_DB: newsroom
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
